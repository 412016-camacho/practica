<div class="min-h-screen bg-gradient-to-br from-purple-900 to-indigo-900 p-4 md:p-8">
  <div class="max-w-6xl mx-auto">
    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl md:text-3xl font-bold text-white">Camino de los Corazones</h1>
      <div class="flex gap-2">
        <button
          (click)="goToHome()"
          class="bg-purple-500 hover:bg-purple-600 text-white font-bold py-2 px-4 rounded-lg transition-colors text-sm">
          Nueva Partida
        </button>
        <button
          (click)="goToRanking()"
          class="bg-yellow-500 hover:bg-yellow-600 text-black font-bold py-2 px-4 rounded-lg transition-colors text-sm">
          Ranking
        </button>
      </div>
    </div>

    @if (loading && !game) {
      <div class="flex justify-center items-center py-12">
        <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-pink-500"></div>
      </div>
    }

    @if (error) {
      <div class="bg-red-500/20 border border-red-500 text-red-200 px-4 py-3 rounded-lg mb-4">
        {{ error }}
      </div>
    }

    @if (game) {
      <div class="grid gap-6 lg:grid-cols-2">
        <!-- Game Board -->
        <div>
          <app-game-board
            [game]="game"
            [lastTurn]="lastTurn"
            [loading]="playingTurn"
            (playTurnRequested)="onPlayTurn($event)">
          </app-game-board>
        </div>

        <!-- Turn History -->
        <div>
          <app-turn-history
            [turns]="turnHistory"
            [gameId]="gameId"
            (refreshRequested)="onRefreshHistory()"
            (turnSelected)="onTurnSelected($event)">
          </app-turn-history>
        </div>
      </div>
    }
  </div>
</div>
