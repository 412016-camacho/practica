<div class="min-h-screen bg-gradient-to-br from-purple-900 to-indigo-900 p-8">
  <div class="max-w-4xl mx-auto">
    <div class="text-center mb-8">
      <h1 class="text-4xl font-bold text-white mb-2">Camino de los Corazones</h1>
      <p class="text-purple-200">Selecciona un mundo para comenzar tu aventura</p>
    </div>

    @if (loading) {
      <div class="flex justify-center items-center py-12">
        <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-pink-500"></div>
      </div>
    }

    @if (error) {
      <div class="bg-red-500/20 border border-red-500 text-red-200 px-4 py-3 rounded-lg mb-4">
        {{ error }}
      </div>
    }

    @if (!loading && !error) {
      <div class="grid gap-6 md:grid-cols-2">
        @for (world of worlds; track world.id) {
          <div
            class="bg-white/10 backdrop-blur-sm rounded-xl p-6 border border-white/20 hover:bg-white/20 transition-all cursor-pointer transform hover:scale-105"
            (click)="selectWorld(world.id)">
            <h2 class="text-2xl font-bold text-white mb-2">{{ world.name }}</h2>
            <p class="text-purple-200 mb-4">{{ world.description }}</p>
            <button class="w-full bg-pink-500 hover:bg-pink-600 text-white font-bold py-2 px-4 rounded-lg transition-colors">
              Seleccionar Mundo
            </button>
          </div>
        } @empty {
          <div class="col-span-2 text-center text-purple-200 py-8">
            No hay mundos disponibles
          </div>
        }
      </div>

      <div class="mt-8 text-center">
        <button
          (click)="goToRanking()"
          class="bg-yellow-500 hover:bg-yellow-600 text-black font-bold py-3 px-8 rounded-lg transition-colors">
          Ver Ranking
        </button>
      </div>
    }
  </div>
</div>
